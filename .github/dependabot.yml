version: 2

updates:
  # Keeps the commit SHAs pinned in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Kotlin and Android Gradle dependencies. See DEC-009.
  #
  # Dependency locking is on, so a bump here also needs app/gradle.lockfile
  # regenerated on the same branch with 'gradle :app:dependencies --write-locks'.
  # Dependabot does not do that, so its pull requests fail the Android build
  # until someone pushes the new lockfile. See CONTRIBUTING.md.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
