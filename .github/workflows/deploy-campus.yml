name: Deploy campus VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Point Gradle at the SDK and campus URLs
        env:
          HOST: ${{ secrets.CAMPUS_VM_HOST }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> local.properties
          if [ -n "$HOST" ]; then
            printf 'collector.url=http://%s:8080\n' "$HOST" >> local.properties
            printf 'download.url=http://%s:9000/app-debug.apk\n' "$HOST" >> local.properties
          fi

      - uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          gradle-version-file: gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK and refresh VM
        env:
          HOST: ${{ secrets.CAMPUS_VM_HOST }}
          USER: ${{ secrets.CAMPUS_VM_USER }}
          KEY: ${{ secrets.CAMPUS_VM_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "Campus secrets not set; skipping deploy."
            exit 0
          fi
          USER="${USER:-root}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_ed25519 app/build/outputs/apk/debug/app-debug.apk \
            "${USER}@${HOST}:/opt/coaching/apk/app-debug.apk"
          ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" bash -s <<'REMOTE'
          set -e
          install -d /opt/coaching/{apk,data,repo}
          if [ ! -d /opt/coaching/repo/running-coach-app/.git ]; then
            git clone https://github.com/Running-Coach-App/running-coach-app.git /opt/coaching/repo/running-coach-app
          fi
          cd /opt/coaching/repo/running-coach-app
          git fetch origin && git checkout main && git pull --ff-only origin main
          bash deploy/vm/install-services.sh /opt/coaching/repo/running-coach-app
          systemctl restart coaching-collector coaching-apk
          REMOTE